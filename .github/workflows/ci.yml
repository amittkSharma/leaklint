name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: yarn install --frozen-lockfile
      - run: yarn test
      - run: yarn types
      - run: node dist/src/cli.js src # dogfood gate
